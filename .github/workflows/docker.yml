name: Docker

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - "secdiagram_core/**"
      - "tests/**"
      - ".github/workflows/docker.yml"
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - "secdiagram_core/**"
      - "tests/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-scan:
    name: Build image & scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: secdiagram:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test CLI
        run: docker run --rm secdiagram:ci --help
      # Report-only: the bundled Node.js/Mermaid CLI layer can carry upstream
      # base-image CVEs that cannot be fixed from this repository.
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: secdiagram:ci
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-image.sarif
          exit-code: "0"
          ignore-unfixed: true
      - name: Upload Trivy SARIF
        if: always() && hashFiles('trivy-image.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
        continue-on-error: true
