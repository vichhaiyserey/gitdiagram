# Docker Compose setup for local Ollama with secdiagram
#
# 1. Start Ollama container:
#    docker compose -f docker-compose.ollama.yml up -d
#
# 2. Pull Qwen (e.g. qwen2.5-coder):
#    docker exec -it ollama ollama pull qwen2.5-coder
#
# 3. Run secdiagram with Ollama:
#    python secdiagram.py --dir . --ollama qwen2.5-coder
#
services:
  ollama:
    image: ollama/ollama:0.40.14@sha256:ebaef4f4c5d93660e1f25f8ad085a112f51ccfb0e8458073e71793959dba91c9
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_data:
