services:
  secdiagram:
    build:
      context: .
      dockerfile: Dockerfile
    image: secdiagram:latest
    container_name: secdiagram
    volumes:
      # Mount current workspace/repository into the container
      - .:/repo
    environment:
      - GITDIAGRAM_LLM_BASE_URL=http://ollama:11434/v1
      - GITDIAGRAM_LLM_TIMEOUT=600
    depends_on:
      - ollama
    networks:
      - secdiagram-net

  ollama:
    image: ollama/ollama:latest
    container_name: secdiagram-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - secdiagram-net

networks:
  secdiagram-net:
    driver: bridge

volumes:
  ollama_data:
