services:
  secdiagram:
    build:
      context: .
      dockerfile: Dockerfile
    image: secdiagram:local
    container_name: secdiagram
    volumes:
      # Mount current workspace/repository into the container
      - .:/repo
    environment:
      - SECDIAGRAM_LLM_BASE_URL=http://ollama:11434/v1
      - SECDIAGRAM_LLM_TIMEOUT=600
    depends_on:
      - ollama
    networks:
      - secdiagram-net

  ollama:
    image: ollama/ollama:0.40.14@sha256:ebaef4f4c5d93660e1f25f8ad085a112f51ccfb0e8458073e71793959dba91c9
    container_name: secdiagram-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - secdiagram-net

networks:
  secdiagram-net:
    driver: bridge

volumes:
  ollama_data:
