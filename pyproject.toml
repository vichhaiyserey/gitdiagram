[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gitdiagram"
version = "0.1.0"
description = "Deterministic architecture, relationship, and security diagrams for Python repositories."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "gitdiagram maintainers" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Documentation",
    "Topic :: Security",
]

[project.scripts]
gitdiagram = "gitdiagram_core.cli:main"
gitdiagram-image = "gitdiagram_core.render_image:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gitdiagram_core*"]
