[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gitdiagram"
version = "0.1.0"
description = "Deterministic architecture, relationship, and security diagrams for Python repositories."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "gitdiagram maintainers" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Documentation",
    "Topic :: Security",
]

[project.scripts]
gitdiagram = "gitdiagram_core.cli:main"
gitdiagram-image = "gitdiagram_core.render_image:main"

[project.optional-dependencies]
dev = [
    "bandit[toml]>=1.7.9",
    "coverage[toml]>=7.6",
    "mypy>=1.11",
    "pip-audit>=2.7",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["gitdiagram_core*"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [".venv", "tests/fixtures"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"gitdiagram_core/__init__.py" = ["E402"]
"tests/**" = ["E402"]

[tool.mypy]
python_version = "3.10"
files = ["gitdiagram_core"]
ignore_missing_imports = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["gitdiagram_core"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
